name: arc.io Automated Subdomain & Nuclei Scan

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: 
jobs:
  security_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Subfinder & Nuclei (Fast Download)
        run: |
          wget -q https://github.com/projectdiscovery/subfinder/releases/download/v2.6.6/subfinder_2.6.6_linux_amd64.zip
          unzip -o subfinder_2.6.6_linux_amd64.zip -d /usr/local/bin/
          wget -q https://github.com/projectdiscovery/nuclei/releases/download/v3.3.5/nuclei_3.3.5_linux_amd64.zip
          unzip -o nuclei_3.3.5_linux_amd64.zip -d /usr/local/bin/

      - name: Update Nuclei Templates
        run: nuclei -update-templates

      - name: Run Subfinder
        run: subfinder -d arc.io -timeout 10 -o subdomains.txt

      - name: Run Nuclei Scan (Medium, High, Critical Only)
        run: nuclei -l subdomains.txt -severity medium,high,critical -timeout 5 -retries 1 -rate-limit 150 -o nuclei_report.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arc-io-scan-reports
          path: nuclei_report.txt
