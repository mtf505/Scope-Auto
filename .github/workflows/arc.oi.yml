name: arc.io Automated Subdomain & Nuclei Scan

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch: 

jobs:
  security_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Scan Script
        run: python scan.py 

      - name: Upload Artifacts (Reports)
        uses: actions/upload-artifact@v4
        with:
          name: arc-io-scan-reports
          path: scan_results/
