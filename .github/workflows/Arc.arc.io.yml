name: Arc arc.io Automated Subdomain & Nuclei Scan

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 8:00 AM Muscat time (4:00 UTC)
    - cron: '0 10 * * *' # 4:00 PM Muscat time (12:00 UTC)
  workflow_dispatch: 

jobs:
  security_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 1000
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest Versions & Install Tools
        run: |
          # Get the latest release tags from GitHub API dynamically
          SUBFINDER_TAG=$(curl -s https://api.github.com/repos/projectdiscovery/subfinder/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          NUCLEI_TAG=$(curl -s https://api.github.com/repos/projectdiscovery/nuclei/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          
          # Remove the 'v' prefix for the filename (e.g., v3.3.5 -> 3.3.5)
          SUBFINDER_VER=${SUBFINDER_TAG#v}
          NUCLEI_VER=${NUCLEI_TAG#v}
          
          echo "Installing Subfinder $SUBFINDER_TAG and Nuclei $NUCLEI_TAG"
          
          # Download and install Subfinder
          wget -q https://github.com/projectdiscovery/subfinder/releases/download/${SUBFINDER_TAG}/subfinder_${SUBFINDER_VER}_linux_amd64.zip
          unzip -o subfinder_${SUBFINDER_VER}_linux_amd64.zip -d /usr/local/bin/
          
          # Download and install Nuclei
          wget -q https://github.com/projectdiscovery/nuclei/releases/download/${NUCLEI_TAG}/nuclei_${NUCLEI_VER}_linux_amd64.zip
          unzip -o nuclei_${NUCLEI_VER}_linux_amd64.zip -d /usr/local/bin/

      - name: Update Nuclei Templates
        run: nuclei -update-templates

      - name: Run Subfinder
        run: subfinder -d arc.io -timeout 10 -o subdomains.txt

      - name: Run Nuclei Scan (Medium, High, Critical Only)
        run: nuclei -l subdomains.txt -severity medium,high,critical -timeout 5 -retries 1 -rate-limit 150 -o nuclei_report.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arc.io-scan-reports
          path: nuclei_report.txt
